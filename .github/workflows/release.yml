name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install mygo CLI
        run: go install github.com/egoist/mygo/cmd/mygo@v0.6.4

      - name: Install frontend dependencies
        run: bun install

      # mygo 无 cgo，单台 ubuntu 即可交叉编译全平台
      - name: Build all platforms
        run: bun run build -- -platform windows/amd64,linux/amd64,darwin/arm64

      # .app 是目录，上传工具只收单文件，打成 zip；dmg 需要 hdiutil，仅 macOS 可做
      - name: Zip macOS bundle
        run: |
          cd build/darwin-arm64
          zip -qry "GDUT-Course-Helper-${GITHUB_REF_NAME}-mac-arm64.zip" "GDUT Course Helper.app"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/windows-amd64/*
            build/linux-amd64/*
            build/darwin-arm64/*.zip
          generate_release_notes: true
