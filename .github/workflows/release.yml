name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install mygo CLI
        run: go install github.com/egoist/mygo/cmd/mygo@latest

      - name: Install frontend dependencies
        run: bun install

      # mygo 无 cgo，单台 ubuntu 即可交叉编译全平台
      - name: Build all platforms
        run: bun run build -- -platform windows/amd64,linux/amd64,darwin/arm64

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/windows-amd64/*
            build/linux-amd64/*
            build/darwin/arm64/*
          generate_release_notes: true
